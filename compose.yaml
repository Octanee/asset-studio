# Universal Asset Studio — application services (ADR-005).
# Every port is published on 127.0.0.1 only (NFR-005). ComfyUI and training run natively
# under the host agent. The MCP server only calls the API (ADR-008).
name: asset-studio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asset_studio
      POSTGRES_USER: asset_studio
      POSTGRES_PASSWORD: ${ASSET_STUDIO_DB_PASSWORD:?set ASSET_STUDIO_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_studio -d asset_studio"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:${ASSET_STUDIO_DB_PORT:-5433}:5432"

  api:
    build: ./backend
    # Migrations run before the API starts (forward-only, see Data-Model).
    command: ["sh", "-c", "alembic upgrade head && uvicorn asset_studio.main:app --host 0.0.0.0 --port 8400"]
    environment: &backend-env
      ASSET_STUDIO_DATABASE_URL: postgresql+psycopg://asset_studio:${ASSET_STUDIO_DB_PASSWORD}@db:5432/asset_studio
      ASSET_STUDIO_DATA_DIR: /data
      # 'api' is the internal service name used by the worker and the MCP server.
      ASSET_STUDIO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      ASSET_STUDIO_SESSION_SECRET: ${ASSET_STUDIO_SESSION_SECRET:?set ASSET_STUDIO_SESSION_SECRET in .env}
      ASSET_STUDIO_MCP_TOKEN: ${ASSET_STUDIO_MCP_TOKEN:-}
      ASSET_STUDIO_WORKER_TOKEN: ${ASSET_STUDIO_WORKER_TOKEN:-}
      # ComfyUI and the host agent run natively on the host's loopback (ADR-005).
      ASSET_STUDIO_ENGINE_PROVIDER: ${ASSET_STUDIO_ENGINE_PROVIDER:-comfyui}
      ASSET_STUDIO_COMFYUI_URL: http://host.docker.internal:${ASSET_STUDIO_COMFYUI_PORT:-8188}
      ASSET_STUDIO_HOST_AGENT_URL: http://host.docker.internal:${ASSET_STUDIO_AGENT_PORT:-8410}
      ASSET_STUDIO_HOST_AGENT_TOKEN: ${ASSET_STUDIO_AGENT_TOKEN:-}
      # The host's model folder (ComfyUI layout), shared with ComfyUI (FR-081).
      ASSET_STUDIO_MODELS_DIR: /models
      # Publishing writes only under this folder: a Windows folder of your choice (ADR-013).
      ASSET_STUDIO_EXPORT_ROOTS: /exports
      # Backups are written here: a Windows folder, so they live outside Docker (ADR-013).
      ASSET_STUDIO_BACKUPS_DIR: /backups
      # Each training run's images and captions go here for kohya under the host agent (ADR-011).
      ASSET_STUDIO_TRAINING_DIR: /training
      # Shown in Settings > MCP connection.
      ASSET_STUDIO_MCP_PORT: ${ASSET_STUDIO_MCP_PORT:-8411}
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    volumes:
      - asset-data:/data  # library lives in a named volume (ADR-013)
      - ${ASSET_STUDIO_MODELS_HOST_DIR:-./models}:/models:ro  # scan only
      - ${ASSET_STUDIO_EXPORTS_HOST_DIR:-./exports}:/exports  # plans check existing files
      - ${ASSET_STUDIO_BACKUPS_HOST_DIR:-./backups}:/backups:ro  # lists backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASSET_STUDIO_API_PORT:-8400}:8400"

  worker:
    build: ./backend
    command: ["python", "-m", "asset_studio.worker"]
    environment: *backend-env
    extra_hosts: *host-gateway
    volumes:
      - asset-data:/data  # library lives in a named volume (ADR-013)
      - ${ASSET_STUDIO_MODELS_HOST_DIR:-./models}:/models  # approved downloads (RULE-008)
      - ${ASSET_STUDIO_EXPORTS_HOST_DIR:-./exports}:/exports  # publishing writes here
      - ${ASSET_STUDIO_BACKUPS_HOST_DIR:-./backups}:/backups  # backup writes, restore reads
      - ${ASSET_STUDIO_TRAINING_HOST_DIR:-./training}:/training  # exchange with kohya
    depends_on:
      db:
        condition: service_healthy

  # MCP server for Claude (ADR-008): only calls the API with the caller's MCP token. No
  # database, no volumes, no secrets of its own.
  mcp:
    build: ./backend
    command: ["python", "-m", "asset_studio_mcp"]
    environment:
      ASSET_STUDIO_MCP_API_URL: http://api:8400
      ASSET_STUDIO_MCP_BIND: 0.0.0.0
      ASSET_STUDIO_MCP_PORT: "8411"
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ASSET_STUDIO_MCP_PORT:-8411}:8411"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ASSET_STUDIO_WEB_PORT:-8480}:8080"

volumes:
  db-data:
  asset-data:
