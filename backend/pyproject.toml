[project]
name = "asset-studio"
version = "0.1.0"
description = "Universal Asset Studio backend: local-first AI asset creation and management."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "structlog>=24.4",
  "httpx>=0.28,<1",
  # ComfyUI step progress over its /ws socket (already used by uvicorn).
  "websockets>=13",
  # DWPose pose detection on the CPU (ADR-009; approved for WP-07).
  "onnxruntime>=1.20,<2",
  "numpy>=1.26,<3",
  "pillow>=13,<14",
  "mcp>=1.20,<2",
  "resvg-py>=0.5,<0.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_studio", "src/asset_studio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Shares the generation fixtures by importing them; pytest uses them by parameter name.
"tests/test_lora_generation.py" = ["F811"]
"tests/test_svg.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["asset_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_packages = ["asset_studio", "asset_studio_mcp"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules never import the API layer"
type = "forbidden"
source_modules = ["asset_studio.modules"]
forbidden_modules = ["asset_studio.api"]

[[tool.importlinter.contracts]]
name = "The MCP server only calls the API: no database, files or domain code (ADR-008)"
type = "forbidden"
source_modules = ["asset_studio_mcp"]
forbidden_modules = ["asset_studio", "sqlalchemy", "psycopg"]

[[tool.importlinter.contracts]]
name = "Foundation modules do not depend on domain modules"
type = "forbidden"
source_modules = [
  "asset_studio.modules.audit",
  "asset_studio.modules.jobs",
  "asset_studio.modules.providers",
  "asset_studio.modules.storage",
]
forbidden_modules = [
  "asset_studio.modules.projects",
  "asset_studio.modules.styles",
  "asset_studio.modules.references",
  "asset_studio.modules.poses",
  "asset_studio.modules.models",
  "asset_studio.modules.workflows",
  "asset_studio.modules.generation",
  "asset_studio.modules.assets",
  "asset_studio.modules.processing",
  "asset_studio.modules.quality",
  "asset_studio.modules.review",
  "asset_studio.modules.training",
  "asset_studio.modules.publishing",
  "asset_studio.modules.system",
]
